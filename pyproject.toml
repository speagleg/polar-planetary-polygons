[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "planetary-polygons"
version = "0.2.0"
description = "Why Rotating Fluids Make Polygons"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "sympy>=1.12",
    "jupyter>=1.0",
    "ipykernel>=6",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "nbmake>=1.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "deprecated: tests for deprecated modules (deselect with -m 'not deprecated')",
]
